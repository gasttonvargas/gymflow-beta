<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymFlow - Iniciar Sesión</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1>🏋️ GymFlow</h1>
                <p>Sistema de Gestión para Gimnasios</p>
            </div>
            
            {% if get_flashed_messages() %}
                {% for message in get_flashed_messages(with_categories=true) %}
                    <div class="flash flash-{{ message[0] }}">
                        {{ message[1] }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-input" 
                           placeholder="admin" required autofocus>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-input" 
                           placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Ingresar al Sistema
                </button>
            </form>
            
            <div style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--gray-600);">
                <p><strong>Demo:</strong> admin / admin123</p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
