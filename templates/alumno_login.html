<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Alumnos - GymFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div style="text-align: center; margin-bottom: 1rem;">
                <a href="{{ url_for('index') }}" class="btn btn-sm btn-secondary">← Volver</a>
            </div>
            
            <div class="login-logo">
                <div style="font-size: 4rem; margin-bottom: 1rem;">💪</div>
                <h1>Acceso Alumnos</h1>
                <p>Ingresá con tus credenciales</p>
            </div>
            
            {% if get_flashed_messages() %}
                {% for message in get_flashed_messages(with_categories=true) %}
                    <div class="flash flash-{{ message[0] }}">
                        {{ message[1] }}
                    </div>
                {% endfor %}
            {% endif %}
            
            <form method="POST" action="{{ url_for('alumno_login') }}">
                <div class="form-group">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-input" 
                           placeholder="Tu usuario" required autofocus>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-input" 
                           placeholder="Tu contraseña" required>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">
                    Ingresar a Mi Rutina
                </button>
            </form>
            
            <div style="margin-top: 2rem; text-align: center; font-size: 0.85rem; color: var(--gray-600);">
                <p><strong>¿No tenés usuario?</strong></p>
                <p>Consultá con tu profesor</p>
                <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--gray-200);">
                <p><strong>Usuario de prueba:</strong></p>
                <p>maria / gym123</p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
